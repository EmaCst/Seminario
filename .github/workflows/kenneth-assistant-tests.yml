name: Kenneth assistant regression tests

on:
  push:
    branches:
      - feature/custom-visualization-engine
    paths:
      - "Backend/**"
      - "Frontend/**"
      - ".github/workflows/kenneth-assistant-tests.yml"
  pull_request:
    paths:
      - "Backend/**"
      - "Frontend/**"
      - ".github/workflows/kenneth-assistant-tests.yml"
  workflow_dispatch:

jobs:
  test-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Run Kenneth quality gate (synthetic SQLite, no Ollama)
        run: python -m app.quality.run --report-dir quality_reports
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kenneth-quality-report-py${{ matrix.python-version }}
          path: |
            Backend/quality_reports/report.json
            Backend/quality_reports/report.md
          if-no-files-found: warn
          retention-days: 14

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate frontend source
        run: npm run lint
      - name: Build React application
        run: npm run build
