name: Kenneth assistant regression tests

on:
  push:
    branches:
      - feature/custom-visualization-engine
    paths:
      - "Backend/**"
      - ".github/workflows/kenneth-assistant-tests.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/kenneth-assistant-tests.yml"
  workflow_dispatch:

jobs:
  test-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Run assistant regression suite without live database or Ollama
        run: python -m unittest discover -s tests -p 'test_assistant*.py' -v
